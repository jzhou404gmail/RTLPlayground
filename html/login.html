<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Login</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#ffffff;--bd:#d7dde4;--fg:#1a222c;--fg2:#5c6773;
  --ac:#0969da;--acfg:#ffffff;--bad:#cf222e;
}
:root[data-theme="dark"]{
  --bg:#0e1116;--panel:#161b22;--bd:#2c333c;--fg:#e6edf3;--fg2:#8d96a0;
  --ac:#4c8ef7;--acfg:#ffffff;--bad:#f85149;
}
:root[data-theme="sel-dark"]{
  --bg:#103c48;--panel:#184956;--bd:#2d5b69;--fg:#adbcbc;--fg2:#72898f;
  --ac:#4695f7;--acfg:#ffffff;--bad:#fa5750;
}
:root[data-theme="sel-light"]{
  --bg:#fbf3db;--panel:#ece3cc;--bd:#d5cdb6;--fg:#53676d;--fg2:#909995;
  --ac:#0072d4;--acfg:#ffffff;--bad:#d2212d;
}
*{box-sizing:border-box;margin:0}
body{
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:var(--panel);border:1px solid var(--bd);border-radius:12px;
  padding:36px 32px;width:min(360px,92vw);
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:19px;font-weight:650}
p.sub{color:var(--fg2);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
input[type=password]{
  width:100%;padding:10px 12px;font-size:15px;color:var(--fg);
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;outline:none;
}
input[type=password]:focus{border-color:var(--ac)}
button{
  width:100%;margin-top:18px;padding:10px;font-size:15px;font-weight:600;
  color:var(--acfg);background:var(--ac);border:0;border-radius:8px;cursor:pointer;
}
button:hover{filter:brightness(1.1)}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:14px;text-align:center}
</style>
<script>
(function(){
  var pref;
  try{pref=localStorage.getItem("theme")||"auto";}catch(e){pref="auto";}
  var dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t=pref;
  if(pref==="auto")t=dark?"dark":"light";
  if(pref==="auto-sel")t=dark?"sel-dark":"sel-light";
  document.documentElement.dataset.theme=t;
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2">
      <rect x="2" y="7" width="20" height="10" rx="2"/>
      <path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
    </svg>
    <h1 id="hn">Switch Login</h1>
  </div>
  <p class="sub" id="sub">RTLPlayground management interface</p>
  <form method="post" action="login">
    <label for="pwd" id="lp">Password</label>
    <input id="pwd" name="pwd" type="password" autocomplete="current-password" autofocus required
           oninput="document.getElementById('err').textContent=''">
    <button type="submit" id="lb">Sign in</button>
    <div id="err"></div>
  </form>
</div>
<script>
(function(){
  var L={
    de:["Switch-Anmeldung","RTLPlayground-Verwaltungsoberfläche","Passwort","Anmelden","Falsches Passwort, bitte erneut versuchen."],
    en:["Switch Login","RTLPlayground management interface","Password","Sign in","Wrong password, try again."],
    ja:["スイッチ ログイン","RTLPlayground 管理インターフェース","パスワード","ログイン","パスワードが違います。もう一度お試しください。"],
    zh:["交换机登录","RTLPlayground 管理界面","密码","登录","密码错误，请重试。"],
    es:["Inicio de sesión del switch","Interfaz de gestión de RTLPlayground","Contraseña","Iniciar sesión","Contraseña incorrecta, inténtalo de nuevo."],
    fr:["Utilisateur du commutateur","Interface de management RTLPlayground","Mot de passe","Se connecter","Mot de passe erronné, essayez à nouveau."]
  };
  var l=null;
  try{l=localStorage.getItem("rtl_lang");}catch(e){}
  if(!L[l])l=(navigator.language||"en").slice(0,2);
  var s=L[l]||L.en;
  // Name the tab after the switch: the hostname seen at the last login here,
  // otherwise the address, so several open switches can be told apart
  var host=null;
  try{host=localStorage.getItem("rtl_host");}catch(e){}
  document.title=(host||location.hostname)+" – "+s[0];
  document.getElementById("hn").textContent=host||s[0];
  document.getElementById("sub").textContent=s[1];
  document.getElementById("lp").textContent=s[2];
  document.getElementById("lb").textContent=s[3];
  if(document.referrer.endsWith("login.html"))document.getElementById("err").textContent=s[4];
})();
</script>
<script>
function sha256Hex(bytes){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=bytes.length, n=((l+9+63)>>6)<<6;
  var b=new Uint8Array(n); b.set(bytes); b[l]=0x80;
  var dv=new DataView(b.buffer);
  dv.setUint32(n-4,(l*8)>>>0);
  var w=new Uint32Array(64);
  function rr(x,r){return (x>>>r)|(x<<(32-r));}
  for(var off=0;off<n;off+=64){
    for(var i=0;i<16;i++) w[i]=dv.getUint32(off+i*4);
    for(i=16;i<64;i++){
      var s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3);
      var s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25);
      var ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+K[i]+w[i])>>>0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22);
      var maj=(a&bb)^(a&c)^(bb&c);
      var t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  var out="";
  for(i=0;i<8;i++) out+=("00000000"+H[i].toString(16)).slice(-8);
  return out;
}
function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function bytesToHex(b){var s="";for(var i=0;i<b.length;i++)s+=("0"+b[i].toString(16)).slice(-2);return s;}
(function(){
  var form=document.querySelector('form');
  var err=document.getElementById('err');
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var pw=document.getElementById('pwd');
    if(!pw.value)return;
    err.textContent='';
    fetch('/auth.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(!j.set){err.textContent='No password provisioned; use the serial console.';return;}
      var salt=hexToBytes(j.salt);
      var pwd=new TextEncoder().encode(pw.value);
      var buf=new Uint8Array(salt.length+pwd.length);
      buf.set(salt,0);buf.set(pwd,salt.length);
      var h=document.createElement('input');
      h.type='hidden';h.name='pwd';h.value=sha256Hex(buf);
      pw.removeAttribute('name');
      form.appendChild(h);
      form.submit();
    }).catch(function(){err.textContent='Login service unavailable.';});
  });
})();
</script>
</body>
</html>
