<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Login</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#ffffff;--bd:#d7dde4;--fg:#1a222c;--fg2:#5c6773;
  --ac:#0969da;--acfg:#ffffff;--bad:#cf222e;
}
:root[data-theme="dark"]{
  --bg:#0e1116;--panel:#161b22;--bd:#2c333c;--fg:#e6edf3;--fg2:#8d96a0;
  --ac:#4c8ef7;--acfg:#ffffff;--bad:#f85149;
}
:root[data-theme="sel-dark"]{
  --bg:#103c48;--panel:#184956;--bd:#2d5b69;--fg:#adbcbc;--fg2:#72898f;
  --ac:#4695f7;--acfg:#ffffff;--bad:#fa5750;
}
:root[data-theme="sel-light"]{
  --bg:#fbf3db;--panel:#ece3cc;--bd:#d5cdb6;--fg:#53676d;--fg2:#909995;
  --ac:#0072d4;--acfg:#ffffff;--bad:#d2212d;
}
*{box-sizing:border-box;margin:0}
body{
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:var(--panel);border:1px solid var(--bd);border-radius:12px;
  padding:36px 32px;width:min(360px,92vw);
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:19px;font-weight:650}
p.sub{color:var(--fg2);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
.pwrow{position:relative}
input.pw{
  width:100%;padding:10px 44px 10px 12px;font-size:15px;color:var(--fg);
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;outline:none;
}
input.pw:focus{border-color:var(--ac)}
/* Reveal toggle inside the field, at its right edge. */
.eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;
  color:var(--fg2);background:transparent;border:0;border-radius:6px;cursor:pointer;
}
.eye:hover{color:var(--fg);background:var(--bg)}
.eye:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.eye svg{width:19px;height:19px;pointer-events:none}
.eye .ic-shut{display:none}
.eye.on .ic-occhi{display:none}
.eye.on .ic-shut{display:block}
/* First-run setup: a second field, without the reveal button, shown only
   while no password exists yet. */
#pw2row{margin-top:14px}
#pw2row[hidden]{display:none}
#pwd2{padding-right:12px}
button{
  width:100%;margin-top:18px;padding:10px;font-size:15px;font-weight:600;
  color:var(--acfg);background:var(--ac);border:0;border-radius:8px;cursor:pointer;
}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.55;cursor:default;filter:none}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:14px;text-align:center}
</style>
<script>
(function(){
  var pref;
  try{pref=localStorage.getItem("theme")||"auto";}catch(e){pref="auto";}
  var dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t=pref;
  if(pref==="auto")t=dark?"dark":"light";
  if(pref==="auto-sel")t=dark?"sel-dark":"sel-light";
  document.documentElement.dataset.theme=t;
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2">
      <rect x="2" y="7" width="20" height="10" rx="2"/>
      <path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
    </svg>
    <h1 id="hn">Switch Login</h1>
  </div>
  <p class="sub" id="sub">RTLPlayground management interface</p>
  <form method="post" action="login">
    <label for="pwd" id="lp">Password</label>
    <div class="pwrow">
      <input id="pwd" class="pw" name="pwd" type="password" autocomplete="current-password" autofocus required
             oninput="document.getElementById('err').textContent=''">
      <button type="button" class="eye" id="pwtoggle" aria-pressed="false"
              aria-label="Show password" title="Show password">
        <svg class="ic-occhi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="ic-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3l18 18"/><path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.7 18.7 0 0 1-3.2 4.1"/>
          <path d="M6.6 6.7A18.6 18.6 0 0 0 1 12s4 7 11 7a10.8 10.8 0 0 0 5.4-1.4"/>
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
        </svg>
      </button>
    </div>
    <div id="pw2row" hidden>
      <label for="pwd2" id="lp2">Repeat password</label>
      <input id="pwd2" class="pw" type="password" autocomplete="new-password" maxlength="20">
    </div>
    <button type="submit" id="lb">Sign in</button>
    <div id="err"></div>
  </form>
</div>
<script>
(function(){
  var L={
    de:["Switch-Anmeldung","RTLPlayground-Verwaltungsoberfläche","Passwort","Anmelden","Falsches Passwort, bitte erneut versuchen.","Passwort anzeigen","Passwort verbergen",
        "Kein Passwort gesetzt. Wählen Sie eines für das Administratorkonto.","Passwort wiederholen","Passwort setzen","Die Passwörter stimmen nicht überein.","Passwort: 6-20 Zeichen, keine Leerzeichen.","Das Passwort konnte nicht gesetzt werden.","Kein Passwort gesetzt. Laden Sie diese Seite neu, um eines zu setzen."],
    en:["Switch Login","RTLPlayground management interface","Password","Sign in","Wrong password, try again.","Show password","Hide password",
        "No password is set. Choose one for the admin account.","Repeat password","Set password","Passwords do not match.","Password: 6-20 characters, no spaces.","Could not set the password.","No password is set. Reload this page to set one."],
    ja:["スイッチ ログイン","RTLPlayground 管理インターフェース","パスワード","ログイン","パスワードが違います。もう一度お試しください。","パスワードを表示","パスワードを隠す",
        "パスワードが未設定です。管理者用のパスワードを設定してください。","パスワード（再入力）","パスワードを設定","パスワードが一致しません。","パスワード: 6〜20 文字、空白なし。","パスワードを設定できませんでした。","パスワードが未設定です。このページを再読み込みして設定してください。"],
    zh:["交换机登录","RTLPlayground 管理界面","密码","登录","密码错误，请重试。","显示密码","隐藏密码",
        "尚未设置密码。请为管理员设置一个密码。","重复密码","设置密码","两次输入的密码不一致。","密码: 6-20 个字符，不能含空格。","无法设置密码。","尚未设置密码。请刷新此页面进行设置。"],
    es:["Inicio de sesión del switch","Interfaz de gestión de RTLPlayground","Contraseña","Iniciar sesión","Contraseña incorrecta, inténtalo de nuevo.","Mostrar contraseña","Ocultar contraseña",
        "No hay contraseña configurada. Elige una para la cuenta de administrador.","Repetir contraseña","Establecer contraseña","Las contraseñas no coinciden.","Contraseña: 6-20 caracteres, sin espacios.","No se pudo establecer la contraseña.","No hay contraseña configurada. Recarga esta página para establecer una."],
    fr:["Utilisateur du commutateur","Interface de management RTLPlayground","Mot de passe","Se connecter","Mot de passe erronné, essayez à nouveau.","Afficher le mot de passe","Masquer le mot de passe",
        "Aucun mot de passe n'est défini. Choisissez-en un pour le compte administrateur.","Confirmer le mot de passe","Définir le mot de passe","Les mots de passe ne correspondent pas.","Mot de passe : 6 à 20 caractères, sans espaces.","Impossible de définir le mot de passe.","Aucun mot de passe n'est défini. Rechargez cette page pour en définir un."]
  };
  var l=null;
  try{l=localStorage.getItem("rtl_lang");}catch(e){}
  if(!L[l])l=(navigator.language||"en").slice(0,2);
  var s=L[l]||L.en;
  window.__loginI18n=s;
  // Name the tab after the switch: the hostname seen at the last login here,
  // otherwise the address, so several open switches can be told apart
  var host=null;
  try{host=localStorage.getItem("rtl_host");}catch(e){}
  document.title=(host||location.hostname)+" – "+s[0];
  document.getElementById("hn").textContent=host||s[0];
  document.getElementById("sub").textContent=s[1];
  document.getElementById("lp").textContent=s[2];
  document.getElementById("lb").textContent=s[3];
  if(document.referrer.endsWith("login.html"))document.getElementById("err").textContent=s[4];
})();
</script>
<script>
function sha256Hex(bytes){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=bytes.length, n=((l+9+63)>>6)<<6;
  var b=new Uint8Array(n); b.set(bytes); b[l]=0x80;
  var dv=new DataView(b.buffer);
  dv.setUint32(n-4,(l*8)>>>0);
  var w=new Uint32Array(64);
  function rr(x,r){return (x>>>r)|(x<<(32-r));}
  for(var off=0;off<n;off+=64){
    for(var i=0;i<16;i++) w[i]=dv.getUint32(off+i*4);
    for(i=16;i<64;i++){
      var s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3);
      var s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25);
      var ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+K[i]+w[i])>>>0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22);
      var maj=(a&bb)^(a&c)^(bb&c);
      var t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  var out="";
  for(i=0;i<8;i++) out+=("00000000"+H[i].toString(16)).slice(-8);
  return out;
}
function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function bytesToHex(b){var s="";for(var i=0;i<b.length;i++)s+=("0"+b[i].toString(16)).slice(-2);return s;}
(function(){
  var s=window.__loginI18n||["","","","","","Show password","Hide password"];
  var btn=document.getElementById('pwtoggle');
  var pwd=document.getElementById('pwd');
  function label(shown){ return s[shown?6:5]; }
  btn.addEventListener('click',function(){
    var show=pwd.type==='password';
    pwd.type=show?'text':'password';
    btn.classList.toggle('on',show);
    btn.setAttribute('aria-pressed',show?'true':'false');
    btn.setAttribute('aria-label',label(show));
    btn.title=label(show);
    pwd.focus();
  });
})();
(function(){
  var form=document.querySelector('form');
  var err=document.getElementById('err');
  var pw=document.getElementById('pwd');
  var pw2=document.getElementById('pwd2');
  var pw2row=document.getElementById('pw2row');
  var lp2=document.getElementById('lp2');
  var lb=document.getElementById('lb');
  var sub=document.getElementById('sub');
  var s=window.__loginI18n||["","","","","","Show password","Hide password",
    "No password is set. Choose one for the admin account.","Repeat password","Set password",
    "Passwords do not match.","Password: 6-20 characters, no spaces.","Could not set the password.",
    "No password is set. Reload this page to set one."];
  /* digest: a password exists, POST SHA-256(salt || password)
   * legacy: an old plaintext passwd line exists, POST the plaintext once
   * setup:  no credential at all, choose the first admin password */
  var mode="digest", ready=false;

  function setMode(j){
    if(j&&j.set)mode="digest";
    else if(j&&j.legacy)mode="legacy";
    else mode="setup";
    if(mode==="setup"){
      sub.textContent=s[7];
      lp2.textContent=s[8];
      lb.textContent=s[9];
      pw2row.hidden=false;
      pw.autocomplete="new-password";
      err.textContent='';
    }
  }

  /* Do not let a submit race the /auth.json answer: the mode decides whether
   * the password is hashed, sent as the legacy plaintext or used for setup. */
  lb.disabled=true;
  fetch('/auth.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    setMode(j);
    ready=true;
    lb.disabled=false;
  }).catch(function(){
    /* Keep the normal login form; submitting refetches auth.json and reports
     * the failure instead of silently posting the wrong form. */
    ready=true;
    lb.disabled=false;
  });
  setTimeout(function(){ if(!ready){ready=true;lb.disabled=false;} },3000);

  function setup(pwv){
    if(pwv.length<6||pwv.length>20||/\s/.test(pwv)){err.textContent=s[11];return;}
    if(pwv!==pw2.value){err.textContent=s[10];return;}
    if(!window.crypto||!crypto.getRandomValues){err.textContent=s[12];return;}
    var salt=new Uint8Array(16);
    crypto.getRandomValues(salt);
    var p=new TextEncoder().encode(pwv);
    var buf=new Uint8Array(salt.length+p.length);
    buf.set(salt,0);buf.set(p,salt.length);
    err.textContent='';
    lb.disabled=true;
    fetch('/login',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded','X-RTLP':'1'},
      body:'salt='+bytesToHex(salt)+'&hash='+sha256Hex(buf)
    }).then(function(r){
      if(!r.ok||/\/login\.html(\?|$)/.test(r.url))throw new Error('setup');
      location.href='/';
    }).catch(function(){err.textContent=s[12];lb.disabled=false;});
  }

  form.addEventListener('submit',function(ev){
    if(!ready){ev.preventDefault();return;}
    if(mode==="legacy"){
      /* The firmware still has the old plaintext credential: the native form
       * POST is the compatibility path, and a password change in the System
       * tab replaces it with a digest. */
      return;
    }
    ev.preventDefault();
    if(!pw.value)return;
    err.textContent='';
    if(mode==="setup"){setup(pw.value);return;}
    fetch('/auth.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(!j.set){err.textContent=s[13];return;}
      var salt=hexToBytes(j.salt);
      var p=new TextEncoder().encode(pw.value);
      var buf=new Uint8Array(salt.length+p.length);
      buf.set(salt,0);buf.set(p,salt.length);
      var h=document.createElement('input');
      h.type='hidden';h.name='pwd';h.value=sha256Hex(buf);
      pw.removeAttribute('name');
      form.appendChild(h);
      form.submit();
    }).catch(function(){err.textContent='Login service unavailable.';});
  });
})();
</script>
</body>
</html>
